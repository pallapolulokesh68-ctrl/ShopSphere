
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ShopSphere</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="logo">Shop<span>Sphere</span></div>

        <nav>
            <a href="index.html">Home</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <!-- Checkout Section -->
    <section class="checkout-section">

        <h1>Checkout</h1>
        <p class="section-description">
            Enter your delivery details to place your order.
        </p>

        <div class="checkout-layout">

            <!-- Delivery Form -->
            <div class="checkout-form">

                <h2>Delivery Information</h2>

                <form id="checkoutForm">

                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter 10-digit phone number"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="address">Delivery Address</label>
                        <textarea
                            id="address"
                            placeholder="Enter your complete address"
                            required
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="city">City</label>
                        <input
                            type="text"
                            id="city"
                            placeholder="Enter your city"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="pincode">PIN Code</label>
                        <input
                            type="text"
                            id="pincode"
                            placeholder="Enter 6-digit PIN code"
                            pattern="[0-9]{6}"
                            maxlength="6"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Payment Method</label>
                        <input
                            type="text"
                            value="Cash on Delivery (COD)"
                            readonly
                        >
                    </div>

                    <button type="submit" class="checkout-btn">
                        Place Order
                    </button>

                    <p id="checkoutMessage" class="auth-message"></p>

                </form>

            </div>

            <!-- Order Summary -->
            <div class="checkout-summary">

                <h2>Order Summary</h2>

                <div id="checkoutItems">
                    Loading cart details...
                </div>

                <h3 id="checkoutTotal">
                    Total: ₹0
                </h3>

                <a href="cart.html" class="back-home">
                    ← Back to Cart
                </a>

            </div>

        </div>

    </section>

    <!-- Footer -->
    <footer>
        <h2>ShopSphere</h2>
        <p>Your shopping destination, all in one place.</p>
        <p>© 2026 ShopSphere. All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
