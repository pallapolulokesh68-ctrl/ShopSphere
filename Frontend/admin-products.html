
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Products | ShopSphere</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <header class="navbar">

        <h2 class="logo">ShopSphere Admin</h2>

        <nav>
            <a href="admin.html">Dashboard</a>
            <a href="admin-products.html">Manage Products</a>
            <a href="admin-orders.html">Manage Orders</a>
            <a href="#" onclick="adminLogout(); return false;">Logout</a>
        </nav>

    </header>

    <!-- MAIN SECTION -->
    <main class="admin-section">

        <h1>Manage Products</h1>

        <p>Add, update and manage your store products.</p>

        <div id="productAdminMessage"></div>

        <!-- ADD / EDIT PRODUCT FORM -->
        <section class="admin-actions">

            <h2 id="productFormTitle">Add New Product</h2>

            <form id="adminProductForm">

                <input
                    type="hidden"
                    id="editProductId"
                >

                <div class="form-group">
                    <label for="productName">Product Name</label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Enter product name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="productDescription">Description</label>

                    <textarea
                        id="productDescription"
                        placeholder="Enter product description"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="productPrice">Price (₹)</label>

                    <input
                        type="number"
                        id="productPrice"
                        min="0.01"
                        step="0.01"
                        placeholder="Enter price"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="productCategory">Category</label>

                    <select id="productCategory" required>
                        <option value="">Select Category</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Home">Home</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="productImage">Image URL</label>

                    <input
                        type="url"
                        id="productImage"
                        placeholder="Enter product image URL"
                    >
                </div>

                <div class="form-group">
                    <label for="productStock">Available Stock</label>

                    <input
                        type="number"
                        id="productStock"
                        min="0"
                        step="1"
                        placeholder="Enter stock quantity"
                        required
                    >
                </div>

                <button type="submit" class="admin-submit-btn">
                    Save Product
                </button>

                <button
                    type="button"
                    id="cancelEditBtn"
                    class="admin-cancel-btn"
                    onclick="cancelProductEdit()"
                    style="display:none;"
                >
                    Cancel Edit
                </button>

            </form>

        </section>

        <!-- PRODUCT LIST -->
        <section class="admin-actions product-management-list">

            <h2>All Products</h2>

            <div id="adminProductsContainer">
                Loading products...
            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <h2>ShopSphere</h2>
        <p>© 2026 ShopSphere. All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
